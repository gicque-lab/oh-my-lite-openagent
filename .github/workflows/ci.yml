name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck

  compat:
    name: Compat (real host matrix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run compat runner (fetches pinned npm host packages; no provider secrets needed)
        run: npm run test:compat
      - name: Upload compat artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-compat-results
          path: |
            .liteagent/scratch/opencode-compat/report.json
            .liteagent/scratch/opencode-compat/compatibility-report.md
            .liteagent/scratch/opencode-compat/logs/
